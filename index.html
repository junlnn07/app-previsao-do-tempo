<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do Tempo Horária</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>🌤️ Previsão do Tempo Horária</h1>
        <input type="text" id="city" placeholder="Digite o nome da cidade" title="Exemplo: Curitiba" />
        <button onclick="getWeather()" class="btn">Buscar por Cidade</button>
        <button onclick="getWeatherByLocation()" class="btn">Usar Minha Localização</button>
        <button onclick="toggleTheme()" class="btn theme-btn">Tema Noturno</button>
        <div id="loader" class="loader hidden"></div>
        <div id="weather" class="fade-in">
            <button id="toggleView" class="btn toggle-btn hidden" onclick="toggleView()">Alternar Vista</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
